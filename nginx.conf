server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    # text/xml y no solo application/xml: es lo que el mime map de nginx le
    # asigna a los .xml, y sin eso el sitemap y el feed viajan sin comprimir.
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml application/rss+xml
               image/svg+xml;

    location = /rss.xml {
        types { }
        default_type application/rss+xml;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;

        # El HTML referencia los assets hasheados: si se cachea, un deploy
        # nuevo deja al browser pidiendo /_astro/ que ya no existen.
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # add_header no se hereda: un bloque con add_header propio pierde los
        # del server. Por eso el include se repite en cada location.
        include /etc/nginx/snippets/security-headers.conf;
    }

    error_page 404 /404.html;
}
